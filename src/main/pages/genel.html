<!--
  ================================================================
  GENEL BAKIŞ (OVERVIEW)
  Sizes, colours and spacing are inline; :hover and :focus states are tied to the .h-* / .f-*
  classes in edge.css. Data: all fields are filled with real Steam data through genel.js.
  ================================================================

<div style="flex:1;overflow-y:auto;padding:24px 26px 30px 44px;display:flex;flex-direction:column;gap:18px;width:100%;margin:0">

  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#8B8F9E">Konsol</span>
      <h1 style="margin:0;font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#DCE2FA">Genel Bakış</h1>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button id="gRefresh" class="h-brand" style="height:36px;padding:0 16px;border-radius:999px;background:#090C12;border:1px solid #333D4D;color:#B9C0D6;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px;cursor:pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B8F9E" stroke-width="1.8"><path d="M4 12a8 8 0 0 1 13.3-6M20 12a8 8 0 0 1-13.3 6"></path><path d="M17 3v3.5h-3.5M7 21v-3.5h3.5"></path></svg>
        Yenile
      </button>
      <button id="gOpenQueue" class="h-brand" style="height:36px;padding:0 18px;border-radius:999px;background:#090C12;border:1px solid #333D4D;color:#B9C0D6;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer">Kuyruğu Aç</button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
    <div style="border:1px solid #2B3345;border-radius:12px;background:#0D1118;padding:16px 18px;display:flex;align-items:center;gap:14px">
      <div style="width:38px;height:38px;flex-shrink:0;border-radius:12px;background:#151C28;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2AAEE" stroke-width="1.8"><rect x="3" y="7" width="12" height="14" rx="2"></rect><path d="M8 4h9a2 2 0 0 1 2 2v11"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8B8F9E">Toplam Kart</span>
        <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#DCE2FA" id="gStatCards">-</span>
        <span style="font-size:11px;color:#656D80" id="gStatCardsSub">Kart Düşür sekmesinde yenile</span>
      </div>
    </div>
    <div style="border:1px solid #2B3345;border-radius:12px;background:#0D1118;padding:16px 18px;display:flex;align-items:center;gap:14px">
      <div style="width:38px;height:38px;flex-shrink:0;border-radius:12px;background:#151C28;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2AAEE" stroke-width="1.8"><rect x="3" y="4" width="7" height="7" rx="1"></rect><rect x="14" y="4" width="7" height="7" rx="1"></rect><rect x="3" y="15" width="7" height="5" rx="1"></rect><rect x="14" y="15" width="7" height="5" rx="1"></rect></svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8B8F9E">Kütüphane</span>
        <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#DCE2FA" id="gStatGames">-</span>
        <span style="font-size:11px;color:#656D80" id="gStatGamesSub">-</span>
      </div>
    </div>
    <div style="border:1px solid #2B3345;border-radius:12px;background:#0D1118;padding:16px 18px;display:flex;align-items:center;gap:14px">
      <div style="width:38px;height:38px;flex-shrink:0;border-radius:12px;background:#151C28;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2AAEE" stroke-width="1.8"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8B8F9E">Bu Oturum</span>
        <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#DCE2FA" id="gStatSession">00<span style="color:#C2AAEE">:</span>00</span>
        <span style="font-size:11px;color:#656D80" id="gStatSessionSub">-</span>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
    <div id="gNavHub" class="h-bd" style="border:1px solid #2B3345;border-radius:12px;background:#0D1118;padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer">
      <div style="width:38px;height:38px;flex-shrink:0;border-radius:12px;background:#151C28;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2AAEE" stroke-width="1.8"><path d="M4 8h16v12H4z"></path><path d="M4 8l2-4h12l2 4"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8B8F9E">Envanter &amp; Pazar</span>
        <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#C2AAEE" id="gStatValue">-</span>
        <span style="font-size:11px;color:#656D80" id="gStatValueSub">Envanter sekmesinde yenile</span>
      </div>
    </div>
    <div id="gNavBoost" class="h-bd" style="border:1px solid #2B3345;border-radius:12px;background:#0D1118;padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer">
      <div style="width:38px;height:38px;flex-shrink:0;border-radius:12px;background:#151C28;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2AAEE" stroke-width="1.8"><path d="M13 3 5 14h6l-1 7 8-11h-6z"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8B8F9E">Saat Yükseltici</span>
        <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#DCE2FA" id="gStatBoost">0 aktif</span>
        <span style="font-size:11px;color:#656D80" id="gStatBoostSub">Çalışmıyor</span>
      </div>
    </div>
    <div id="gNavAch" class="h-bd" style="border:1px solid #2B3345;border-radius:12px;background:#0D1118;padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer">
      <div style="width:38px;height:38px;flex-shrink:0;border-radius:12px;background:#151C28;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2AAEE" stroke-width="1.8"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M12 13v4M9 20h6"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8B8F9E">Başarımlar</span>
        <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#C2AAEE" id="gStatAch">-</span>
        <span style="font-size:11px;color:#656D80" id="gStatAchSub">Başarımlar'da oyun seç</span>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,1.06fr);gap:14px;align-items:stretch;flex:1;min-height:0">

    <div style="display:flex;flex-direction:column;gap:14px;min-height:0">
      <div style="border:1px solid #2B3345;border-radius:12px;background:#0D1118;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column">
        <div style="height:48px;flex-shrink:0;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1D2432">
          <span style="font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#8B8F9E">Son Aktiviteler</span>
          <button id="gClearFeed" class="h-brand" style="height:28px;padding:0 12px;border-radius:999px;background:transparent;border:1px solid #2B3345;color:#8B8F9E;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer">Hepsini Temizle</button>
        </div>
        <div style="display:grid;flex-shrink:0;grid-template-columns:minmax(240px,1fr) 130px 100px;gap:0;padding:0 18px;height:34px;align-items:center;border-bottom:1px solid #1D2432;background:#090C12">
          <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Olay</span>
          <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Durum</span>
          <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E;text-align:right">Saat</span>
        </div>
        <div style="flex:1;min-height:0;overflow-y:auto" id="gFeed"></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto">

      <div style="border:1px solid #2B3345;border-radius:12px;background:#0D1118;overflow:hidden;display:flex;flex-direction:column;flex:56 1 0;min-height:274px">
        <div style="height:48px;flex-shrink:0;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1D2432">
          <span style="font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#8B8F9E">Aktif Görev</span>
          <div id="gRunPill" style="display:flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:12px;background:#101621;border:1px solid #B37E24">
            <span style="width:6px;height:6px;border-radius:12px;background:#B37E24;animation:e-dotPulse 1.6s ease-in-out infinite"></span>
            <span style="font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#B37E24">Hazır</span>
          </div>
        </div>
        <div id="gActiveBody" style="padding:14px 18px;display:flex;flex-direction:column;gap:11px;flex-shrink:0"></div>
        <div id="gQueue" style="flex:1 1 auto;min-height:38px;overflow-y:auto;border-top:1px solid #1D2432;padding:0 18px"></div>
        <div style="padding:13px 18px;flex-shrink:0;border-top:1px solid #1D2432;display:flex;align-items:center;gap:10px">
          <button id="gStart" class="h-start" style="height:38px;padding:0 22px;border-radius:999px;background:#5624B3;border:1px solid #5624B3;color:#DCE2FA;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer">Başlat</button>
          <button id="gStop" class="h-stop" style="height:38px;padding:0 22px;border-radius:999px;background:#B32453;border:1px solid #B32453;color:#DCE2FA;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer">Durdur</button>
          <button id="gDetail" class="h-bd" style="height:38px;margin-left:auto;padding:0 16px;border-radius:999px;background:#090C12;border:1px solid #333D4D;color:#B9C0D6;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer">Detay</button>
        </div>
      </div>

      <div style="border:1px solid #2B3345;border-radius:12px;background:#0D1118;overflow:hidden;flex:44 1 0;min-height:184px;display:flex;flex-direction:column">
        <div style="height:36px;flex-shrink:0;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid #1D2432">
          <span style="font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#8B8F9E">Hızlı İşlemler</span>
        </div>
        <div style="flex:1;min-height:0;padding:10px 14px;display:flex;flex-direction:column;gap:7px;justify-content:center">
          <button id="qaGames" class="h-brand" style="flex:1 1 auto;min-height:30px;max-height:46px;padding:0 13px;border-radius:999px;background:#090C12;border:1px solid #333D4D;color:#B9C0D6;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:flex-start;gap:9px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
            Oyun Listesini Yenile
          </button>
          <button id="qaInv" class="h-brand" style="flex:1 1 auto;min-height:30px;max-height:46px;padding:0 13px;border-radius:999px;background:#090C12;border:1px solid #333D4D;color:#B9C0D6;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:flex-start;gap:9px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
            Envanteri Yenile
          </button>
          <button id="qaMarket" class="h-brand" style="flex:1 1 auto;min-height:30px;max-height:46px;padding:0 13px;border-radius:999px;background:#090C12;border:1px solid #333D4D;color:#B9C0D6;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:flex-start;gap:9px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"></path><path d="m7 14 3-4 3 3 5-6"></path></svg>
            Pazarı Yenile
          </button>
          <button id="qaSettings" class="h-brand" style="flex:1 1 auto;min-height:30px;max-height:46px;padding:0 13px;border-radius:999px;background:#090C12;border:1px solid #333D4D;color:#B9C0D6;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:flex-start;gap:9px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"></circle><circle cx="12" cy="12" r="8"></circle></svg>
            Ayarlar
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
