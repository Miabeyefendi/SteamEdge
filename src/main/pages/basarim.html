<!-- ================================================================
     BAŞARIMLAR
     Ölçü, renk ve boşluk değerleri inline duruyor; :hover ve :focus
     durumları edge.css icindeki .h-* / .f-* class'larına bağlıdır.
     Veri: basarim.js - Steam protokolünden şema, global nadirlik ve açılma zamanı.
     ================================================================ -->
<div style="flex:1;overflow-y:auto;padding:24px 26px 30px 44px;display:flex;flex-direction:column;gap:18px;width:100%;margin:0">

  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#8B8F9E">Başarım Yöneticisi</span>
      <h1 style="margin:0;font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#DCE2FA">Başarımlar</h1>
    </div>
    <div style="display:flex;align-items:center;gap:26px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Toplam Başarım</span>
        <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#DCE2FA" id="acStatTotal">-</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Açılan</span>
        <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#5FB324" id="acUnlockedNum">-</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Kilitli</span>
        <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#B37E24" id="acLockedNum">-</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Nadir ve Üstü</span>
        <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#24AEB3" id="acRareNum">-</span>
      </div>
    </div>
  </div>

  <div style="border:1px solid #2B3345;border-radius:12px;background:#0D1118;padding:20px 22px;display:flex;align-items:center;gap:28px">
    <!-- Kütüphane Başlığı oranı: 920x430 (~2.14:1) -->
    <div style="width:97px;height:45px;flex-shrink:0;border-radius:10px;border:1px solid #2B3345;background:repeating-linear-gradient(135deg,#151C28 0 6px,#101621 6px 12px);overflow:hidden">
      <img id="acLogo" style="width:100%;height:100%;object-fit:cover;transform:scale(1.03)">
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;min-width:200px">
      <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Genel İlerleme</span>
      <span style="font-size:18px;font-weight:700;color:#DCE2FA" id="acGameName">Oyun seçilmedi</span>
    </div>
    <div style="width:1px;height:40px;background:#1D2432"></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span style="font-family:Geist Mono,monospace;font-size:12px;color:#8B8F9E" id="acSummaryText">-</span>
        <span style="font-family:Geist Mono,monospace;font-size:22px;font-weight:700;color:#C2AAEE;line-height:1" id="acPctBig">%0</span>
      </div>
      <div style="height:8px;border-radius:12px;background:#090C12;border:1px solid #1D2432;overflow:hidden">
        <div id="acBar" style="height:100%;width:0%;border-radius:12px;background:#24AEB3"></div>
      </div>
    </div>
  </div>

  <div style="width:100%;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <div style="position:relative;display:flex;align-items:center;flex:1 1 180px;min-width:150px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B8F9E" stroke-width="1.8" style="position:absolute;left:12px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.3-4.3"></path></svg>
      <input id="acSearch" type="text" placeholder="Başarım adı veya açıklaması ara..." class="f-focus" style="width:100%;height:34px;border-radius:12px;background:#0D1118;border:1px solid #2B3345;color:#DCE2FA;font-size:12px;padding:0 12px 0 34px;outline:none">
    </div>
    <!-- Aranabilir oyun seçici: yazmaya başlayınca liste daralır (kütüphane yüzlerce oyun
         olabildiği için düz <select> ile oyun bulmak zordu). -->
    <div id="acGameBox" style="position:relative;min-width:190px;flex:0 1 auto">
      <input id="acGameInput" type="text" placeholder="Oyun ara / seç..." autocomplete="off" class="f-focus"
             style="width:100%;height:34px;border-radius:12px;background:#0D1118;border:1px solid #2B3345;color:#DCE2FA;font-size:12px;padding:0 30px 0 12px;outline:none;cursor:pointer">
      <svg id="acGameCaret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8B8F9E" stroke-width="1.8"
           style="position:absolute;right:11px;top:11px;pointer-events:none"><path d="M6 9l6 6 6-6"></path></svg>
      <div id="acGameList" style="display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:50;
           max-height:280px;overflow-y:auto;border-radius:12px;background:#0D1118;border:1px solid #2B3345;
           box-shadow:0 18px 44px rgba(3,3,5,.66);padding:6px"></div>
      <select id="acGameSelect" style="display:none"><option value="">Oyun seç...</option></select>
    </div>
    <select id="acFilter" style="height:34px;border-radius:12px;background:#0D1118;border:1px solid #2B3345;color:#B9C0D6;font-size:12px;padding:0 12px;outline:none;cursor:pointer;min-width:132px;flex:0 1 auto">
      <option value="all">Tüm başarımlar</option>
      <option value="unlocked">Açılanlar</option>
      <option value="locked">Kilitliler</option>
      <option value="rare">Nadir ve üstü</option>
      <option value="ultrarare">Ultra nadir</option>
    </select>
    <select id="acSort" style="height:34px;border-radius:12px;background:#0D1118;border:1px solid #2B3345;color:#B9C0D6;font-size:12px;padding:0 12px;outline:none;cursor:pointer;min-width:126px;flex:0 1 auto">
      <option value="default">Varsayılan sıra</option>
      <option value="alpha">Alfabetik (A-Z)</option>
      <option value="rarity">Nadirliğe göre</option>
      <option value="date">Tarihe göre</option>
    </select>
    <div style="display:flex;gap:4px;padding:4px;border-radius:12px;background:#0D1118;border:1px solid #2B3345">
      <button id="acVGrid" style="width:32px;height:26px;border-radius:999px;border:1px solid #5624B3;background:#5624B3;color:#DCE2FA;cursor:pointer;display:flex;align-items:center;justify-content:center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
      </button>
      <button id="acVList" style="width:32px;height:26px;border-radius:999px;border:1px solid transparent;background:transparent;color:#8B8F9E;cursor:pointer;display:flex;align-items:center;justify-content:center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>
    <button id="acReset" class="h-brand" style="height:34px;padding:0 14px;border-radius:999px;background:transparent;border:1px solid #2B3345;color:#8B8F9E;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer">Sıfırla</button>
  </div>

  <!-- Sayaç satırı FLEX SATIRININ DIŞINDA. İçerideyken yalnızca sol sütunu aşağı itiyor,
       sağdaki Detay paneli ise satırın tepesinden başlıyordu; ilk başarım satırı ile panel
       hizasız kalıyordu. Dışarı alınınca iki sütun da aynı y'den başlıyor. -->
  <span style="font-family:Geist Mono,monospace;font-size:11px;color:#656D80" id="acCount">-</span>

  <div style="display:flex;gap:14px;align-items:flex-start">
    <div style="flex:1;min-width:0">
      <div id="acBody"></div>
    </div>
    <!-- Detay paneli sayfayla birlikte kayar (sticky): yüzlerce başarımı olan oyunlarda
         aşağı inince panel ekrandan çıkıyordu. `top` üstteki filtre çubuğunun altına denk
         gelir; `max-height` ile panel kendi içinde kayar, sayfayı uzatmaz. -->
    <aside id="acDetail" style="width:280px;flex-shrink:0;position:sticky;top:12px;align-self:flex-start;max-height:calc(100vh - 150px);overflow-y:auto;border:1px solid #2B3345;border-radius:12px;background:#0D1118;padding:20px;display:flex;flex-direction:column;gap:14px"></aside>
  </div>

  <!-- Seçim / toplu aç-kilitle çubuğu da sayfayla birlikte kayar (sticky, alta yapışık):
       yüzlerce başarımda aşağı inerken çubuk ekrandan çıkıyordu, seçimi görmek için
       en alta kadar inmek gerekiyordu. Detay paneliyle aynı davranış. -->
  <div style="position:sticky;bottom:0;z-index:20;margin-top:auto;border:1px solid #2B3345;border-radius:12px;background:#0D1118;box-shadow:0 -10px 26px rgba(3,3,5,.55);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:26px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Seçim</span>
        <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#DCE2FA" id="acPickLabel">0 başarım</span>
      </div>
      <div style="width:1px;height:34px;background:#1D2432"></div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Tahmini Süre</span>
        <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#DCE2FA" id="acPickEta">00:00</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Güvenli Mod</span>
        <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#5FB324" id="acSafeMode">Açık</span>
      </div>
      <!-- MADDE 8: toplu islem sirasinda canli durum. Kullanici eskiden butona basip
           hicbir sey gormuyordu: acildi mi, siradaki ne zaman, hata mi var bilinmiyordu. -->
      <div id="acRunBox" style="display:none;flex-direction:column;gap:5px;min-width:230px">
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-family:Geist Mono,monospace;font-size:15px;font-weight:700;color:#DCE2FA" id="acRunCount">0 / 0</span>
          <span style="font-size:11px;color:#8B8F9E" id="acRunNote"></span>
        </div>
        <div style="width:100%;height:6px;border-radius:12px;background:#090C12;border:1px solid #1D2432;overflow:hidden">
          <div id="acRunFill" style="height:100%;width:0%;border-radius:12px;background:#5FB324;transition:width .25s ease"></div>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button id="acSelLocked" class="h-brand" style="height:34px;padding:0 14px;border-radius:999px;background:#090C12;border:1px solid #333D4D;color:#B9C0D6;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer">Kilitlileri Seç</button>
      <button id="acSelClear" class="h-brand" style="height:34px;padding:0 14px;border-radius:999px;background:#090C12;border:1px solid #333D4D;color:#B9C0D6;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer">Seçimi Temizle</button>
      <button id="acAllLock" class="h-signout" style="height:34px;padding:0 14px;border-radius:999px;background:transparent;border:1px solid #B32453;color:#B32453;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer">Seçilenleri Kilitle</button>
      <button id="acAllUnlock" class="h-start" style="height:38px;padding:0 22px;border-radius:999px;background:#5624B3;border:1px solid #5624B3;color:#DCE2FA;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer">Seçilenleri Aç</button>
      <button id="acStop" class="h-stop" style="display:none;height:38px;padding:0 22px;border-radius:999px;background:#B32453;border:1px solid #B32453;color:#DCE2FA;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer">Durdur</button>
    </div>
  </div>
</div>
