<!-- ================================================================
     ENVANTER & PAZAR
     Ölçü, renk ve boşluk değerleri inline duruyor; :hover ve :focus
     durumları edge.css icindeki .h-* / .f-* class'larına bağlıdır.
     Veri: env.js - gerçek Steam envanteri ve pazar fiyatları.
     ================================================================ -->
<div style="flex:1;min-width:0;min-height:0;display:flex;flex-direction:column">

  <div style="flex-shrink:0;min-width:0;padding:20px 26px 16px 44px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid #1D2432;background:#090C12">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#8B8F9E">Birleşik Hub</span>
        <h1 style="margin:0;font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#DCE2FA">Envanter &amp; Pazar</h1>
      </div>
      <div style="display:flex;align-items:center;gap:26px">
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Toplam Öğe</span>
          <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#DCE2FA" id="envStatTotal">-</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Satılabilir</span>
          <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#5FB324" id="envStatSellable">-</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Takaslanabilir</span>
          <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#24AEB3" id="envStatTradable">-</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Envanter Değeri</span>
          <span style="font-family:Geist Mono,monospace;font-size:16px;font-weight:700;color:#5624B3" id="envStatValue">₺0,00</span>
        </div>
      <!-- G8: ortalama (gerceklesen satis medyani) toplu cekme. Ayri dugme cunku her
           oge icin ayri istek gerekiyor ve fiyat cekmekten cok daha pahali. -->
      <button id="envFetchAvg" class="h-brand" style="height:26px;padding:0 12px;border-radius:999px;background:transparent;border:1px solid #5624B3;color:#C2AAEE;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;flex-shrink:0">Ortalamaları Getir</button>
      <!-- G9: solmus satirlarin sebebini yazan kucuk not (env.js > esikRozetiCiz) -->
      <span id="envEsikNot" style="display:none;align-items:center;gap:7px;font-size:10.5px;color:#8B8F9E;cursor:help;flex-shrink:0"></span>
      </div>
    </div>

    <div style="width:100%;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div style="position:relative;display:flex;align-items:center;flex:1 1 180px;min-width:150px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B8F9E" stroke-width="1.8" style="position:absolute;left:12px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.3-4.3"></path></svg>
        <input id="envSearch" type="text" placeholder="Eşya adı veya oyun ara..." class="f-focus" style="width:100%;height:34px;border-radius:12px;background:#0D1118;border:1px solid #2B3345;color:#DCE2FA;font-size:12px;padding:0 12px 0 34px;outline:none">
      </div>
      <select id="efType" style="height:34px;border-radius:12px;background:#0D1118;border:1px solid #2B3345;color:#B9C0D6;font-size:12px;padding:0 12px;outline:none;cursor:pointer;min-width:132px;flex:0 1 auto">
        <option value="all">Tüm türler</option>
        <option value="card">Kartlar</option>
        <option value="background">Arka Planlar</option>
        <option value="emoticon">İfadeler</option>
        <option value="coupon">Kuponlar</option>
        <option value="profile">Profil Öğeleri</option>
        <option value="other">Diğer</option>
      </select>
      <select id="efGame" style="height:34px;border-radius:12px;background:#0D1118;border:1px solid #2B3345;color:#B9C0D6;font-size:12px;padding:0 12px;outline:none;cursor:pointer;min-width:126px;flex:0 1 auto">
        <option value="all">Tüm oyunlar</option>
      </select>
      <select id="efState" style="height:34px;border-radius:12px;background:#0D1118;border:1px solid #2B3345;color:#B9C0D6;font-size:12px;padding:0 12px;outline:none;cursor:pointer;min-width:120px;flex:0 1 auto">
        <option value="all">Tüm durumlar</option>
        <option value="marketable">Satılabilir</option>
        <option value="notmarketable">Satılamaz</option>
        <option value="tradable">Takaslanabilir</option>
        <option value="nottradable">Takaslanamaz</option>
      </select>
      <select id="efPrice" style="height:34px;border-radius:12px;background:#0D1118;border:1px solid #2B3345;color:#B9C0D6;font-size:12px;padding:0 12px;outline:none;cursor:pointer;min-width:130px;flex:0 1 auto">
        <option value="all">Tüm fiyatlar</option>
        <option value="0-1">0 - 1 ₺</option>
        <option value="1-5">1 - 5 ₺</option>
        <option value="5-10">5 - 10 ₺</option>
        <option value="10-">10 ₺ ve üzeri</option>
      </select>
      <div style="display:flex;gap:4px;padding:4px;border-radius:12px;background:#0D1118;border:1px solid #2B3345">
        <button id="vList" style="width:32px;height:26px;border-radius:999px;border:1px solid #5624B3;background:#5624B3;color:#DCE2FA;cursor:pointer;display:flex;align-items:center;justify-content:center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <button id="vGrid" style="width:32px;height:26px;border-radius:999px;border:1px solid transparent;background:transparent;color:#8B8F9E;cursor:pointer;display:flex;align-items:center;justify-content:center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
        </button>
      </div>
      <button id="envGroup" class="h-bd" title="Oyuna göre grupla" style="height:34px;padding:0 14px;border-radius:999px;background:transparent;border:1px solid #2B3345;color:#8B8F9E;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:7px;flex-shrink:0">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 6h16M7 12h13M10 18h10"></path></svg>Grupla</button>
      <button id="efReset" class="h-brand" style="height:34px;padding:0 14px;border-radius:999px;background:transparent;border:1px solid #2B3345;color:#8B8F9E;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer">Sıfırla</button>
    </div>
  </div>

  <div style="flex:1;min-height:0;display:flex">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column">
      <div id="envHead" style="flex-shrink:0;display:grid;grid-template-columns:34px 14px 44px minmax(220px,1.6fr) minmax(150px,1.1fr) 92px 116px 116px;gap:0;align-items:center;height:34px;padding:0 22px 0 44px;border-bottom:1px solid #1D2432">
        <span><span id="selAll" style="width:16px;height:16px;border-radius:12px;border:1px solid #2B3345;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer"></span></span>
        <span id="envSortStatus" title="Duruma göre sırala" style="display:flex;align-items:center;justify-content:flex-start;height:34px;margin:0 -6px;padding:0 6px;cursor:pointer"><span style="width:7px;height:7px;border-radius:12px;background:#656D80;flex-shrink:0"></span></span>
        <span></span>
        <span id="envSortName" style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#656D80;cursor:pointer">Eşya <span style="color:#C2AAEE" id="arrName"></span></span>
        <span id="envSortGame" style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;border-left:1px solid #1D2432;padding-left:9px;color:#656D80;cursor:pointer">Oyun <span style="color:#C2AAEE" id="arrGame"></span></span>
        <span id="envSortQty" style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;border-left:1px solid #1D2432;height:16px;display:flex;align-items:center;justify-content:center;gap:4px;color:#656D80;cursor:pointer">Adet<span style="color:#C2AAEE" id="arrQty"></span></span>
        <span id="envSortLow" style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;border-left:1px solid #1D2432;height:16px;display:flex;align-items:center;justify-content:center;gap:4px;color:#656D80;cursor:pointer">En Düşük<span style="color:#C2AAEE" id="arrLow"></span></span>
        <span id="envSortMed" style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;border-left:1px solid #1D2432;height:16px;display:flex;align-items:center;justify-content:center;gap:4px;color:#656D80;cursor:pointer">Ortalama<span style="color:#C2AAEE" id="arrMed"></span></span>
      </div>

      <div style="flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 22px 8px 44px;border-bottom:1px solid #1D2432">
        <div style="display:flex;align-items:center;gap:14px">
          <span style="font-family:Geist Mono,monospace;font-size:11px;color:#656D80" id="envCount">-</span>
          <span style="width:1px;height:11px;background:#2B3345"></span>
          <div style="display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:12px;background:#5FB324"></span><span style="font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#656D80">Satılabilir</span></div>
          <div style="display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:12px;background:#24AEB3"></span><span style="font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#656D80">Takas</span></div>
          <div style="display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:12px;background:#B32453"></span><span style="font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#656D80">Satılamaz</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
          <span style="font-family:Geist Mono,monospace;font-size:11px;color:#656D80">Fiyatlar · <span id="envPriceProg">-</span></span>
          <!-- Fiyat cekme dugmesi BURADA, filtre satirinda: yaptigi is filtreye bagli.
               Onceki yeri alt bardi ve orayi tasirip sag sinira dayamisti. -->
          <button id="envFetchPrices" class="h-brand" style="height:26px;padding:0 12px;border-radius:999px;background:transparent;border:1px solid #24AEB3;color:#24AEB3;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap">Fiyatları Getir</button>
        </div>
      </div>

      <div id="envScroll" style="flex:1;overflow-y:auto;scrollbar-gutter:stable">
        <div id="envRows"></div>
      </div>
    </div>

    <aside style="width:320px;flex-shrink:0;border-left:1px solid #1D2432;background:#090C12;display:flex;flex-direction:column">
      <div id="envDetail" style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px"></div>
    </aside>
  </div>

  <div style="flex-shrink:0;height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 26px 0 44px;background:#0D1118;border-top:1px solid #2B3345">
    <div style="display:flex;align-items:center;gap:28px">
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Seçili Öğe</span>
        <span style="font-family:Geist Mono,monospace;font-size:19px;font-weight:700;color:#B37E24;line-height:1" id="bulkCount">0</span>
      </div>
      <div style="width:1px;height:34px;background:#2B3345"></div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Brüt Fiyat</span>
        <span style="font-family:Geist Mono,monospace;font-size:19px;font-weight:700;color:#5624B3;line-height:1" id="bulkGross">₺0,00</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8B8F9E">Net Fiyat <span style="color:#656D80">(-%13)</span></span>
        <span style="font-family:Geist Mono,monospace;font-size:19px;font-weight:700;color:#C2AAEE;line-height:1" id="bulkNet">₺0,00</span>
      </div>
    </div>
    <!-- TUM SATIS ISLEMLERI BURADA. Sag detay panelindeki "Satis Stratejisi" ve "Satis
         Fiyati" bolumleri kaldirildi; tekli de topluca da satis bu tek cubuktan yapiliyor.
         "Kendim" secilince manuel fiyat kutusu acilir (env.js > renderBulk). -->
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
      <!-- Fiyat sapma uyarisi: secilen fiyat gercek piyasa degerinden cok uzaksa uyarir -->
      <span id="bulkWarn" style="display:none;align-items:center;gap:6px;font-size:11px;color:#B37E24;max-width:330px;line-height:1.4"></span>
      <button id="bulkClear" class="h-brand" style="height:38px;padding:0 14px;border-radius:999px;background:transparent;border:1px solid #2B3345;color:#8B8F9E;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer">Temizle</button>
      <div style="display:flex;gap:4px;padding:4px;border-radius:999px;background:#090C12;border:1px solid #2B3345" id="bulkStrat">
        <button data-bs="median" style="height:30px;padding:0 11px;border-radius:999px;border:1px solid transparent;background:transparent;color:#8B8F9E;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap">Ortalamadan</button>
        <button data-bs="undercut" style="height:30px;padding:0 11px;border-radius:999px;border:1px solid transparent;background:transparent;color:#8B8F9E;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap">Altına in</button>
        <button data-bs="match" style="height:30px;padding:0 11px;border-radius:999px;border:1px solid transparent;background:transparent;color:#8B8F9E;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap">En ucuzla aynı</button>
        <button data-bs="instant" style="height:30px;padding:0 11px;border-radius:999px;border:1px solid transparent;background:transparent;color:#8B8F9E;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap">Hemen sat</button>
        <button data-bs="manual" style="height:30px;padding:0 11px;border-radius:999px;border:1px solid transparent;background:transparent;color:#8B8F9E;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap">Kendim</button>
      </div>
      <input id="bulkManual" type="text" class="f-focus" placeholder="0,00" style="display:none;width:96px;height:38px;border-radius:12px;background:#090C12;border:1px solid #7031CC;color:#DCE2FA;font-family:Geist Mono,monospace;font-size:13px;font-weight:700;text-align:center;padding:0 10px;outline:none">
      <button id="bulkSellNow" class="h-start" style="height:38px;padding:0 20px;border-radius:999px;background:#5624B3;border:1px solid #5624B3;color:#DCE2FA;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;white-space:nowrap">Sat · <span id="bulkCount2">0</span></button>
    </div>
  </div>
</div>
