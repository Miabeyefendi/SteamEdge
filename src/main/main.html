<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>SteamEdge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style/edge.css">
<!-- Card Farming / Hour Booster are moving to the SteamEdge design in this round; the old common/cards/hours CSS is still loaded because some inner classes produced by cards.js/hours.js (e.g. .cslot, .tbadge) belong to it and have not been moved yet - edge.css is added ON TOP of them, with new class names that do not clash. -->
<link rel="stylesheet" href="style/common.css">
<link rel="stylesheet" href="style/cards.css">
<link rel="stylesheet" href="style/hours.css">
<link rel="stylesheet" href="style/overview.css">
<link rel="stylesheet" href="style/achievements.css">
<link rel="stylesheet" href="style/inventory.css">
<link rel="stylesheet" href="style/settings.css">
<link rel="stylesheet" href="style/redesign.css">
</head>
<body class="edge" style="margin:0;height:100vh;min-height:600px;display:flex;flex-direction:column;background:var(--e-bg);overflow:hidden">

  <!-- TITLEBAR (Electron frameless window controls) -->
  <div class="e-titlebar">
    <span></span>
    <div class="e-tb-btns">
      <button id="min">&#x2212;</button>
      <button id="max">&#x2610;</button>
      <button id="close" class="e-close">&#x2715;</button>
    </div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;min-height:0">

    <!-- TOPBAR (brand + wordmark + version on the left, search/notifications/settings/account on the right) -->
    <header class="e-header">
      <div style="display:flex;align-items:center;gap:12px">
        <img src="../assets/logo-mark.svg" alt="" style="height:26px;width:auto;display:block">
        <span style="font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--e-title)">Steam<span style="color:var(--e-brand)">Edge</span></span>
        <!-- The version comes from package.json (common.js > paintVersion) - it is not written by hand here. -->
        <span id="tbVersion" style="font-family:'Geist Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.08em;color:var(--e-off);border:1px solid var(--e-bdPassive);border-radius:12px;padding:3px 8px">v-</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="e-search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B8F9E" stroke-width="1.8"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.3-4.3"></path></svg>
          <input id="tbSearch" type="text" placeholder="Oyun, eşya veya AppID ara...">
        </div>
        <!-- Sohbet: Steam's friend messages. The badge shows the number of unread messages. -->
        <button id="tbChat" class="e-icon-btn" title="Sohbet">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B8F9E" stroke-width="1.8"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-5.5A8 8 0 0 1 11 4h2a8 8 0 0 1 8 8z"></path></svg>
          <span class="e-badge" id="tbChatBadge" style="display:none"></span>
        </button>
        <button id="tbNotif" class="e-icon-btn" title="Bildirimler">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B8F9E" stroke-width="1.8"><path d="M6 10a6 6 0 0 1 12 0v5l2 2H4l2-2z"></path><path d="M10 20h4"></path></svg>
          <span class="e-badge" id="tbNotifBadge" style="display:none"></span>
        </button>
        <!-- Manual update check. The app already looks once at startup and shows a window ONLY if there is a new version; from here it can look again whenever asked. The result is always told, being up to date is also an answer. -->
        <button id="tbUpdate" class="e-icon-btn" title="Güncellemeleri denetle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B8F9E" stroke-width="1.8"><path d="M12 4v9"></path><path d="M8.5 9.5 12 13l3.5-3.5"></path><path d="M5 17a8 8 0 0 0 14 0"></path></svg>
          <span class="e-badge" id="tbUpdateBadge" style="display:none"></span>
        </button>
        <button id="tbSettings" class="e-icon-btn" title="Ayarlar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"></circle><circle cx="12" cy="12" r="8"></circle><path d="M12 4v2M12 18v2M4 12h2M18 12h2"></path></svg>
        </button>
        <div style="width:1px;height:24px;background:var(--e-bdPassive);margin:0 4px"></div>
        <div class="e-acct" id="tbProfile">
          <div class="e-acct-avatar" id="sideAvatar">-</div>
          <div>
            <div class="e-acct-name" id="sideName">-</div>
            <div class="e-acct-lvl" id="sideLevel">Çevrimiçi</div>
          </div>
          <svg class="e-acct-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </div>
    </header>

    <!-- account switcher accordion -->
    <div class="e-dropdown" id="acctDropdown">
      <span class="e-dropdown-hd">Hesaplar</span>
      <div class="e-acct-list" id="acctList"></div>
      <div class="e-dropdown-sep"></div>
      <button class="e-acct-add" id="acctAddBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"></path></svg>
        Hesap Ekle
      </button>
      <div class="e-dropdown-sep"></div>
      <button class="e-acct-signout" id="acctLogoutBtn">
        <span class="e-dot"></span>
        <div>
          <div class="e-acct-signout-lbl">Bu hesaptan çık</div>
          <div class="e-acct-signout-sub">Aktif kart toplama ve saat yükseltme işlemleri durur</div>
        </div>
      </button>
    </div>
    <!-- notification menu (real activityFeed data - see common.js) -->
    <div class="e-notif-dropdown" id="notifDropdown">
      <span class="e-dropdown-hd">Bildirimler</span>
      <div class="e-notif-list" id="notifList"></div>
    </div>

    <div id="toastBox"></div>

    <!-- BODY ROW: sidebar + content -->
    <div style="flex:1;display:flex;min-height:0;min-width:0;overflow-x:auto">
      <aside class="e-aside" id="sideNav">
        <div>
          <nav class="nav e-nav" id="mainNav">
            <a data-tab="overview" class="e-nav-item active">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20H4z"></path><path d="M10 20v-6h4v6"></path></svg>
              <span class="e-lbl">Genel Bakış</span>
            </a>
            <a data-tab="card" class="e-nav-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="12" height="14" rx="2"></rect><path d="M8 4h9a2 2 0 0 1 2 2v11"></path></svg>
              <span class="e-lbl">Kart Düşür</span>
            </a>
            <a data-tab="inventory" class="e-nav-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16v12H4z"></path><path d="M4 8l2-4h12l2 4"></path><path d="M10 12h4"></path></svg>
              <span class="e-lbl">Envanter &amp; Pazar</span>
            </a>
            <a data-tab="hours" class="e-nav-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 3 5 14h6l-1 7 8-11h-6z"></path></svg>
              <span class="e-lbl">Saat Yükseltici</span>
            </a>
            <a data-tab="realistic" class="e-nav-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
              <span class="e-lbl">Gerçekçi Mod</span>
            </a>
            <a data-tab="achievements" class="e-nav-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M12 13v4M9 20h6"></path><path d="M8 5H5v2a3 3 0 0 0 3 3M16 5h3v2a3 3 0 0 1-3 3"></path></svg>
              <span class="e-lbl">Başarımlar</span>
            </a>
            <a data-tab="keys" class="e-nav-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="12" r="4"></circle><path d="M12 12h9M18 12v3M21 12v2"></path></svg>
              <span class="e-lbl">Anahtarlar</span>
            </a>
            <div class="e-nav-sep"></div>
            <a data-tab="exit" class="e-nav-item e-logout">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 5H6v14h8"></path><path d="M17 8l3 4-3 4M11 12h9"></path></svg>
              <span class="e-lbl">Çıkış Yap</span>
            </a>
          </nav>
        </div>
        <div class="e-sys">
          <span class="e-dot" id="sysDot" style="background:var(--e-warn)"></span>
          <span class="e-sys-lbl">Sistem: <span id="sysLabel" style="color:var(--e-warn)">HAZIR</span></span>
        </div>
        <!-- rail toggle: a half-circle tab sticking out of the edge; the top value shifts with the active nav item (17 + 44*index, see common.js setRailTop) -->
        <button class="e-rail-toggle" id="sideCollapseBtn" title="Kenar çubuğunu daralt" style="top:17px">
          <svg class="e-rail-tab" width="38" height="38" viewBox="0 0 38 38">
            <rect x="18" y="1" width="2" height="36" fill="#090C12"></rect>
            <path d="M19,1 A18,18 0 0,1 19,37" fill="#090C12" stroke="#1D2432" stroke-width="1"></path>
          </svg>
          <svg class="e-rail-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path id="railChev" d="M14 8l-4 4 4 4"></path>
          </svg>
        </button>
      </aside>

      <main class="e-main">
        <section id="tab-overview"></section>
        <section id="tab-card" class="hidden"></section>
        <section id="tab-inventory" class="hidden"></section>
        <section id="tab-hours" class="hidden"></section>
        <section id="tab-realistic" class="hidden"></section>
        <section id="tab-achievements" class="hidden"></section>
        <section id="tab-keys" class="hidden"></section>
        <section id="tab-chat" class="hidden"></section>
        <section id="tab-settings" class="hidden"></section>
        <section id="tab-empty" class="hidden">
          <div class="empty">
            <div id="emptyName" style="font-size:16px;font-weight:600;color:var(--e-muted)">Sekme</div>
            <div style="font-size:13px;color:var(--e-off)">Bu sekmenin içeriği henüz tasarlanmadı.</div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    // The page fragments are injected here synchronously, BEFORE THE PAGE JS FILES RUN -
    // each page's own script (js/*.js) binds to the matching ids with getElementById right away.
    document.getElementById('tab-overview').innerHTML = window.imu.pages.load('overview');
    document.getElementById('tab-card').innerHTML = window.imu.pages.load('cards');
    document.getElementById('tab-inventory').innerHTML = window.imu.pages.load('inventory');
    document.getElementById('tab-hours').innerHTML = window.imu.pages.load('hours');
    document.getElementById('tab-realistic').innerHTML = window.imu.pages.load('realistic');
    document.getElementById('tab-achievements').innerHTML = window.imu.pages.load('achievements');
    document.getElementById('tab-keys').innerHTML = window.imu.pages.load('keys');
    document.getElementById('tab-chat').innerHTML = window.imu.pages.load('chat');
    document.getElementById('tab-settings').innerHTML = window.imu.pages.load('settings');
  </script>
  <!-- Multilingual support: dictionary + translation on the DOM. BEFORE the other page JS files. -->
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/hours.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/listings.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/realistic.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/overview.js"></script>
</body>
</html>
