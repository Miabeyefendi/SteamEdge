name: Build

# Purpose: check that the repository builds from a clean checkout. The published archive
# is produced by hand (WinRAR, -m5); the .zip this workflow makes is kept as an artifact
# for verification only and is not attached to the release.
#
# Fixed in 1.1.8. The earlier version never ran, for two separate reasons: the tag filter
# was "v*" but versions are tagged without the v (1.1.7), and the build output was looked
# up in a folder called "Release V*" - that name has not existed since the repository was renamed.
# Again in 1.2.0: the output folder moved from the parent directory to releases/, and the
# zip step was still looking in the old place.

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

# If the same tag or a manual trigger overlaps, only the latest run is kept.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run verify

      - name: Language audit
        run: npm run lang

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build portable app
        run: npm run build

      - name: Zip
        shell: pwsh
        run: |
          $name = "SteamEdge-v${{ steps.ver.outputs.v }}-win-x64"
          # build.js has written under releases/ since 1.1.11 (standard tree), not the parent folder.
          $src = Join-Path $PWD "releases\$name"
          if (-not (Test-Path $src)) { throw "Build output folder not found: $src" }
          Compress-Archive -Path "$src\*" -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SteamEdge-win-x64
          path: SteamEdge-v${{ steps.ver.outputs.v }}-win-x64.zip
          retention-days: 14
