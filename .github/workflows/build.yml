name: Build

# Amac: depo temiz bir cekimden derlenebiliyor mu, onu dogrulamak. Yayinlanan arsiv
# elle uretiliyor (WinRAR, -m5); bu is akisinin urettigi .zip yalnizca dogrulama icin
# artifact olarak kalir, yayina eklenmez.
#
# 1.1.8'de duzeltildi. Onceki hali iki ayri sebeple hic calismiyordu: etiket filtresi
# "v*" idi ama surumler v'siz etiketleniyor (1.1.7), ve derleme ciktisini "Release V*"
# adinda bir klasorde ariyordu - o isim depo yeniden adlandirilali beri yok.
# 1.2.0'da tekrar: cikti klasoru ust dizinden releases/ altina tasindi, zip adimi
# eski yeri ariyordu.

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run dogrula

      - name: Language audit
        run: npm run dil

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build portable app
        run: npm run build

      - name: Zip
        shell: pwsh
        run: |
          $ad = "SteamEdge-v${{ steps.ver.outputs.v }}-win-x64"
          # build.js 1.1.11'den beri releases/ altina yaziyor (standart agac); ust klasor degil.
          $src = Join-Path $PWD "releases\$ad"
          if (-not (Test-Path $src)) { throw "Build output folder not found: $src" }
          Compress-Archive -Path "$src\*" -DestinationPath "$ad.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SteamEdge-win-x64
          path: SteamEdge-v${{ steps.ver.outputs.v }}-win-x64.zip
          retention-days: 14
