name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Never attach `settings/session.json` or `settings/accounts.json`.**
        They contain your Steam login token. Anyone who has them can sign in as you.

  - type: input
    id: version
    attributes:
      label: SteamEdge version
      description: Settings → About
      placeholder: "1.0.8"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Other (please describe below)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Card farming
        - Hour booster
        - Achievements
        - Inventory & Market
        - Settings
        - Login / accounts
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Opened Inventory & Market
        2. Pressed Fetch prices
        3. Expected prices to load, but the button stayed locked at 1/9
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Settings → Advanced → turn on "Keep debug logs", reproduce the problem, then paste the
        relevant part of `cache/steamedge.log` here.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I did not attach session.json or accounts.json
          required: true
