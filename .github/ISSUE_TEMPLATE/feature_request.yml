name: Feature request
description: Suggest an idea for SteamEdge
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Please check the [tutorial](https://github.com/Miabeyefendi/SteamEdge/blob/main/docs/guides/TUTORIAL.md) first, since
        a fair number of requests turn out to be settings that already exist.

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Card farming
        - Hour booster
        - Achievements
        - Realistic Mode
        - Inventory & Market
        - Chat
        - Themes
        - Settings
        - Notifications
        - Translations
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you run into, not just the feature you want.
      placeholder: |
        I farm on three accounts and I cannot tell at a glance which one dropped a card,
        because the notification does not say which account it belongs to.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything else
      description: Alternatives you considered, similar features in other tools, mockups.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This does not ask for trading, gifting, or anything that abuses another user
          required: true
